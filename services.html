<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="service.css">
    <title>Mercedes-Benz | Site officiel</title>
</head>

<body>
    <main class="services-main">
        <div class="service-container">
            <div class="mercedes-logo">
                <img src="images/mercedes-benz-icon.png" alt="Mercedes-Benz Logo">
            </div>
            <div class="service-content">
                <h1>Demander un RDV</h1>
                <h2>SAV</h2>
                <p class="service-description">It is a long established fact that a reader will be distracted by the
                    readable content of a page when looking at its layout</p>
                <button class="submit-btn" id="open-modal-btn">Suivant <i
                        class="fa-solid fa-circle-arrow-right"></i></button>
            </div>
        </div>
    </main>

    <section class="modal-section">
        <div id="rdv-modal" class="modal-container">
            <div class="modal-content">
                <img src="images/popup.jpg" alt="Mercedes-Benz" class="modal-image">
                <div class="modal-form">
                    <h2 class="modal-title">Demander un<br><span class="rdv-text">RDV SAV</span></h2>

                    <div class="progress-steps">
                        <div class="step active" data-step="1">1</div>
                        <div class="step-line"></div>
                        <div class="step" data-step="2">2</div>
                        <div class="step-line"></div>
                        <div class="step" data-step="3">3</div>
                    </div>

                    <form id="rdv-form-step1" class="form-step active">
                        <div class="form-group">
                            <label for="prenom">Prénom <span class="required" style="color: red;">*</span></label>
                            <input type="text" id="prenom" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="nom">Nom <span class="required"  style="color: red;">*</span></label>
                            <input type="text" id="nom" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="email">E-mail <span class="required" style="color: red;">*</span></label>
                            <input type="email" id="email" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="telephone">Téléphone <span class="required" style="color: red;">*</span></label>
                            <input type="tel" id="telephone" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="civilite">Civilité <span class="required" style="color: red;">*</span></label>
                            <select id="civilite" class="form-select" required>
                                <option value="" selected disabled>Veuillez sélectionner...</option>
                                <option value="monsieur">Monsieur</option>
                                <option value="madame">Madame</option>
                            </select>
                        </div>

                        <button type="button" class="submit-btn" id="next-to-step2">Suivant <i class="fa-solid fa-circle-arrow-right"></i></button>
                    </form>

                    <form id="rdv-form-step2" class="form-step" style="display: none;">
                        <div class="form-group">
                            <label for="immatriculation">Immatriculation du véhicule <span
                                    class="required">*</span></label>
                            <input type="text" id="immatriculation" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="modele">Modèle du véhicule <span class="required">*</span></label>
                            <input type="text" id="modele" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="kilometrage">Kilométrage du véhicule <span class="required">*</span></label>
                            <input type="number" id="kilometrage" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="point-vente">Choisissez votre point de vente <span
                                    class="required">*</span></label>
                            <select id="point-vente" class="form-select" required>
                                <option value="" selected disabled>Veuillez sélectionner...</option>
                                <option value="paris">Paris</option>
                                <option value="lyon">Lyon</option>
                                <option value="marseille">Marseille</option>
                            </select>
                        </div>

                      
                        <div class="button-container">
                            <button type="button" class="submit-btn" id="retour-step1">
                                <i class="fa-solid fa-circle-arrow-left"></i> Retour
                            </button>
                            <button type="submit" class="submit-btn">
                                Terminer <i class="fa-solid fa-circle-arrow-right"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </section>

    <script>
        const openBtn = document.getElementById('open-modal-btn');
        const modal = document.getElementById('rdv-modal');
        const nextToStep2 = document.getElementById('next-to-step2');
        const retourStep1 = document.getElementById('retour-step1');
        const step1Form = document.getElementById('rdv-form-step1');
        const step2Form = document.getElementById('rdv-form-step2');
        const stepElements = document.querySelectorAll('.step');

        openBtn.addEventListener('click', () => {
            modal.style.display = 'flex';
        });

        nextToStep2.addEventListener('click', () => {
            step1Form.style.display = 'none';
            step2Form.style.display = 'block';
            stepElements[0].classList.remove('active');
            stepElements[1].classList.add('active');
        });

        retourStep1.addEventListener('click', () => {
            step2Form.style.display = 'none';
            step1Form.style.display = 'block';
            stepElements[1].classList.remove('active');
            stepElements[0].classList.add('active');
        });
    </script>
</body>

</html>
